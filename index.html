<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MuscleMax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#eef0f4;
  --border:#e2e5eb;
  --text:#13161c;
  --text-dim:#6b7280;
  --accent:#2f5fe0;
  --accent-2:#1f45b3;
  --accent-soft:#e4ebfc;
  --good:#1f9d55;
  --good-soft:#e1f5e8;
  --warn:#b7791f;
  --warn-soft:#faf0dd;
  --bad:#d1453b;
  --bad-soft:#fbe3e1;
  --shadow-1:0 1px 2px rgba(16,24,40,0.04), 0 1px 6px rgba(16,24,40,0.04);
  --shadow-2:0 4px 12px rgba(16,24,40,0.08), 0 2px 4px rgba(16,24,40,0.05);
  --font-display:'Manrope','Inter',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0e12;
    --surface:#15181e;
    --surface-2:#1b1f27;
    --border:#272c36;
    --text:#eceef2;
    --text-dim:#8b93a1;
    --accent:#5b8bff;
    --accent-2:#84a7ff;
    --accent-soft:#1c2740;
    --good:#39c073;
    --good-soft:#132a1d;
    --warn:#e0a83e;
    --warn-soft:#2c2413;
    --bad:#f0574c;
    --bad-soft:#301717;
    --shadow-1:0 1px 2px rgba(0,0,0,0.3);
    --shadow-2:0 8px 20px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0e12;
  --surface:#15181e;
  --surface-2:#1b1f27;
  --border:#272c36;
  --text:#eceef2;
  --text-dim:#8b93a1;
  --accent:#5b8bff;
  --accent-2:#84a7ff;
  --accent-soft:#1c2740;
  --good:#39c073;
  --good-soft:#132a1d;
  --warn:#e0a83e;
  --warn-soft:#2c2413;
  --bad:#f0574c;
  --bad-soft:#301717;
  --shadow-1:0 1px 2px rgba(0,0,0,0.3);
  --shadow-2:0 8px 20px rgba(0,0,0,0.35);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html{ height:100%; overflow:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  position:fixed;
  inset:0;
  height:100%;
  width:100%;
  overflow:hidden;
  touch-action:pan-y;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
#app{ height:100%; display:flex; flex-direction:column; }
h1,h2,h3,.num-display,.gauge-num{ font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em; text-wrap:balance; }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
button{ font-family:inherit; }
input,select{ font-family:inherit; color:var(--text); }
::selection{ background:var(--accent); color:#fff; }
a{ color:var(--accent); }

.shell{ max-width:640px; width:100%; margin:0 auto; padding:20px 16px 32px; display:flex; flex-direction:column; gap:18px; flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }

.topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand{ display:flex; align-items:center; gap:9px; }
.brand .mark{ width:26px; height:26px; border-radius:8px; background:linear-gradient(155deg, var(--accent), var(--accent-2)); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.brand .mark svg{ display:block; }
.brand h1{ font-size:19px; font-weight:800; letter-spacing:-0.01em; margin:0; }
.back-btn{ background:none; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:6px; }
.back-btn:hover{ border-color:var(--accent); color:var(--accent); }
.icon-btn{ background:none; border:none; color:var(--text-dim); cursor:pointer; padding:6px; border-radius:6px; font-size:13px; }
.icon-btn:hover{ color:var(--text); background:var(--surface-2); }
.topbar-actions{ display:flex; align-items:center; gap:6px; }
.profile-chip{ width:30px; height:30px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:var(--font-display); font-weight:700; font-size:11.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.profile-chip:hover{ border-color:var(--accent); color:var(--accent); }
.friend-banner{ font-size:13.5px; color:var(--text-dim); }
.friend-banner b{ color:var(--text); font-weight:700; }

/* ---- Gauge card ---- */
.gauge-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px 20px 16px; box-shadow:var(--shadow-1); }
.body-diagram-card{ background:radial-gradient(120% 140% at 30% 0%, #232838, #14161d); border:1px solid #2a2f3d; border-radius:18px; padding:20px 20px 18px; box-shadow:var(--shadow-1); }
.body-diagram-label{ font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:#8b93a5; font-weight:600; margin-bottom:14px; }
.body-legend-dark{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:16px; }
.body-legend-dark .cal-legend-item{ color:#8b93a5; }
.body-legend-dark .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.gauge-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
.gauge-label{ font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-dim); font-weight:600; }
.gauge-wrap{ position:relative; display:flex; justify-content:center; }
.gauge-svg{ width:100%; max-width:340px; height:auto; display:block; }
.gauge-value{ position:absolute; left:0; right:0; bottom:6px; text-align:center; }
.gauge-num{ font-size:52px; font-weight:700; line-height:1; letter-spacing:-1px; }
.gauge-num span{ font-size:20px; color:var(--text-dim); font-weight:500; }
.gauge-tag{ font-size:13px; color:var(--text-dim); margin-top:2px; }
.chip-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.chip{ background:var(--surface-2); border-radius:10px; padding:9px 6px; text-align:center; }
.chip .chip-val{ font-family:var(--font-mono); font-weight:600; font-size:15px; }
.chip .chip-key{ font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim); margin-top:2px; display:flex; align-items:center; justify-content:center; gap:4px; }
.chip-info-btn{ width:13px; height:13px; border-radius:50%; border:1px solid var(--text-dim); background:none; color:var(--text-dim); font-size:9px; font-family:var(--font-body); font-style:italic; font-weight:700; line-height:1; padding:0; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.chip-info-btn:hover{ border-color:var(--accent); color:var(--accent); }

/* ---- Action grid ---- */
.action-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.action-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 16px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; cursor:pointer; text-align:left; box-shadow:var(--shadow-1); transition:border-color .15s, box-shadow .15s, transform .1s; width:100%; }
.action-card.full-width{ flex-direction:row; align-items:center; gap:14px; padding:14px 16px; }
.action-card.full-width .glyph{ flex-shrink:0; }
.action-card.full-width h3{ margin:0; }
.action-card.full-width p{ margin:1px 0 0; }
.action-card:hover{ border-color:var(--accent); box-shadow:var(--shadow-2); }
.action-card:active{ transform:scale(0.98); }
.action-card .glyph{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; }
.action-card.primary .glyph{ background:var(--accent); }
.action-card.secondary .glyph{ background:var(--surface-2); border:1px solid var(--border); }
.action-card h3{ font-size:17px; margin:0; font-weight:600; }
.action-card p{ font-size:12.5px; color:var(--text-dim); margin:0; line-height:1.4; }

.cal-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 16px 14px; box-shadow:var(--shadow-1); }
.cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:5px; }
.cal-weekdays span{ text-align:center; font-size:10px; color:var(--text-dim); font-weight:600; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cal-cell{ aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11.5px; border:none; padding:0; color:var(--text-dim); background:var(--surface-2); }
.cal-cell.cal-blank{ background:transparent; }
.cal-cell.cal-good{ background:var(--good); color:#0e1c10; font-weight:700; cursor:pointer; }
.cal-cell.cal-warn{ background:var(--warn); color:#241c07; font-weight:700; cursor:pointer; }
.cal-cell.cal-bad{ background:var(--bad); color:#2a0d09; font-weight:700; cursor:pointer; }
.cal-cell.cal-good:hover, .cal-cell.cal-warn:hover, .cal-cell.cal-bad:hover{ filter:brightness(1.08); }
.cal-cell.cal-today{ box-shadow:0 0 0 2px var(--accent) inset; }
.cal-legend{ display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
.cal-legend-item{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-dim); }
.cal-legend .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.cal-legend .dot.good{ background:var(--good); }
.cal-legend .dot.warn{ background:var(--warn); }
.cal-legend .dot.bad{ background:var(--bad); }
.cal-legend .dot.none{ background:var(--surface-2); border:1px solid var(--border); }

.section-title{ font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-dim); font-weight:600; margin:2px 0 -6px; }

/* ---- History ---- */
.history-list{ display:flex; flex-direction:column; gap:10px; }
.wk-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; cursor:pointer; box-shadow:var(--shadow-1); transition:box-shadow .15s; }
.wk-card:hover{ box-shadow:var(--shadow-2); }
.wk-top{ display:flex; align-items:center; justify-content:space-between; }
.wk-date{ font-weight:600; font-size:15px; }
.wk-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
.score-pill{ font-family:var(--font-mono); font-weight:600; font-size:13px; padding:4px 9px; border-radius:999px; }
.wk-meta{ display:flex; gap:14px; margin-top:10px; font-size:12.5px; color:var(--text-dim); flex-wrap:wrap; row-gap:6px; }
.feed-reactions{ display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; }
.reaction-btn{ background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 10px; font-size:13.5px; cursor:pointer; color:var(--text); line-height:1.2; }
.reaction-btn:hover{ border-color:var(--accent); }
.reaction-btn.mine{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2); font-weight:600; }
.wk-meta b{ color:var(--text); font-family:var(--font-mono); font-weight:600; }
.group-chip{ background:var(--surface-2); border-radius:999px; padding:3px 9px; font-size:11.5px; font-weight:600; color:var(--text); }
.streak-card{ background:linear-gradient(135deg, var(--accent-soft), var(--surface)); border:1px solid var(--accent); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-1); }
.streak-card .streak-emoji{ font-size:26px; }
.streak-card .streak-title{ font-weight:700; font-size:14.5px; }
.streak-card .streak-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
.flame-badge{ position:relative; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.flame-badge svg{ display:block; }
.flame-badge .flame-num{ position:absolute; top:52%; left:50%; transform:translate(-50%,-50%); font-family:var(--font-display); font-weight:800; color:#fff; line-height:1; }
.streak-dashboard-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-1); }
.streak-dashboard-card .streak-text-title{ font-weight:700; font-size:15px; }
.streak-dashboard-card .streak-text-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
.feed-streak-badge{ margin-left:auto; }
.wk-detail{ margin-top:12px; padding-top:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
.wk-ex-row{ display:flex; justify-content:space-between; font-size:13.5px; gap:10px; }
.wk-ex-row .sets{ color:var(--text-dim); font-family:var(--font-mono); font-size:12.5px; text-align:right; }
.empty-state{ text-align:center; padding:40px 20px; color:var(--text-dim); font-size:14px; }

/* ---- Workout logging ---- */
.wdate{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); }
.wdate input{ background:none; border:none; color:var(--text); font-family:var(--font-mono); font-size:13px; }
.search-box{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; }
.search-box input{ flex:1; background:none; border:none; outline:none; font-size:16px; }
.search-box input::placeholder{ color:var(--text-dim); }
.picker-panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; }
.picker-group-label{ background:var(--surface); font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); font-weight:700; padding:10px 14px 6px; }
.pr-group-label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); font-weight:700; margin:6px 0 -2px 2px; }
.picker-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-top:1px solid var(--border); cursor:pointer; }
.picker-row:hover{ background:var(--surface-2); }
.picker-row .pname{ font-size:14.5px; font-weight:500; }
.picker-row .plast{ font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); }
.add-custom-link{ display:block; text-align:center; padding:12px; font-size:13px; color:var(--accent); cursor:pointer; border-top:1px solid var(--border); }

.ex-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px 16px; box-shadow:var(--shadow-1); }
.ex-card-head{ display:flex; align-items:center; justify-content:space-between; }
.ex-card-head h3{ font-size:16px; font-weight:600; margin:0; }
.ex-group-tag{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim); }
.rec-hint{ background:var(--accent-soft); color:var(--accent-2); border-radius:9px; padding:8px 10px; font-size:12.5px; margin:10px 0; line-height:1.4; }
:root:not([data-theme="light"]) .rec-hint, :root[data-theme="dark"] .rec-hint{ color:var(--accent-2); }
.rec-hint.good{ background:var(--good-soft); color:var(--good); }
.rec-list{ margin:6px 0 0; padding-left:16px; }
.rec-list li{ margin-top:4px; }
.set-table{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.set-row{ display:grid; grid-template-columns:22px 1fr 1fr 64px 26px; gap:8px; align-items:center; }
.set-row .sidx{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); text-align:center; }
.set-row input, .set-row select{ background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 6px; font-size:16px; text-align:center; width:100%; }
.set-row .rm{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; }
.set-row .rm:hover{ color:var(--bad); }
.set-labels{ display:grid; grid-template-columns:22px 1fr 1fr 64px 26px; gap:8px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); margin-top:10px; }
.add-set-btn{ margin-top:10px; width:100%; background:var(--surface-2); border:1px dashed var(--border); border-radius:9px; padding:9px; font-size:13px; color:var(--text-dim); cursor:pointer; }
.add-set-btn:hover{ color:var(--accent); border-color:var(--accent); }
.ex-remove{ font-size:11.5px; color:var(--text-dim); cursor:pointer; background:none; border:none; }
.ex-remove:hover{ color:var(--bad); }

.workout-log-list{ display:flex; flex-direction:column; gap:12px; }
.finish-bar{ position:fixed; left:0; right:0; bottom:0; background:linear-gradient(to top, var(--bg) 60%, transparent); padding:20px 16px 18px; display:flex; justify-content:center; }
.finish-bar-inner{ max-width:640px; width:100%; display:flex; gap:10px; }
.btn{ border:none; border-radius:12px; padding:13px 18px; font-size:14.5px; font-weight:600; cursor:pointer; }
.btn-primary{ background:var(--accent); color:#fff; flex:1; }
.btn-primary:hover{ background:var(--accent-2); }
.btn-primary:disabled{ opacity:0.45; cursor:not-allowed; }
.btn-ghost{ background:var(--surface); border:1px solid var(--border); color:var(--text-dim); }
.wk-actions{ display:flex; gap:8px; }
.wk-actions .btn{ flex:1; padding:9px; font-size:13px; }
.btn.danger{ color:var(--bad); border-color:var(--bad); }
.btn.danger:hover{ background:var(--bad-soft); }

.modal-backdrop{ position:fixed; inset:0; background:rgba(8,10,14,0.5); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
:root[data-theme="light"] .modal-backdrop{ background:rgba(20,24,32,0.35); }
.modal-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px 18px 0 0; padding:20px; width:100%; max-width:640px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-2); }
.modal-card label{ font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim); display:block; margin-bottom:4px; }
.modal-card input, .modal-card select{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:10px; font-size:16px; }
.modal-row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.detail-e1rm{ font-size:13px; color:var(--text-dim); }
.trend-svg{ width:100%; height:auto; display:block; }
.trend-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow-1); }

.body-diagram{ display:flex; justify-content:center; gap:32px; }
.body-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.body-caption{ font-size:10.5px; color:#8b93a5; text-transform:uppercase; letter-spacing:0.6px; font-weight:700; }
.body-svg{ width:100%; max-width:128px; height:auto; }
.body-svg path, .body-svg rect, .body-svg ellipse{ transition:fill .3s; }

.group-card-list{ display:flex; flex-direction:column; gap:10px; }
.group-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow-1); }
.group-card-head{ display:flex; align-items:center; gap:8px; }
.group-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.group-card-head h3{ font-size:15px; margin:0; flex:1; }
.group-strain{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); }
.group-stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:11px; }
.group-stat-val{ font-family:var(--font-mono); font-weight:600; font-size:13.5px; }
.group-stat-key{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.3px; margin-top:2px; }

.cardio-total-sub{ font-size:12px; color:var(--text-dim); margin-bottom:13px; }
.cardio-rank-list{ display:flex; flex-direction:column; gap:11px; }
.cardio-rank-row{ display:flex; align-items:center; gap:11px; }
.cardio-rank-num{ width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-2); font-family:var(--font-mono); font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.cardio-rank-name{ flex:1; min-width:0; }
.cardio-rank-title{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cardio-rank-sub{ font-size:11px; color:var(--text-dim); margin-top:1px; }
.cardio-rank-stats{ text-align:right; flex-shrink:0; }
.cardio-rank-val{ font-family:var(--font-mono); font-weight:700; font-size:13.5px; }
.cardio-rank-val span{ font-size:10px; font-weight:500; color:var(--text-dim); }

function computeTiming(draft){
  const start = draft && draft.startedAt;
  const durationMin = start ? Math.max(1, Math.round((Date.now()-start)/60000)) : null;
  const timestamps = [];
  (draft && draft.entries || []).forEach(function(en){
    (en.sets||[]).forEach(function(s){ if(s.loggedAt) timestamps.push(s.loggedAt); });
  });
  timestamps.sort(function(a,b){ return a-b; });
  const gaps = [];
  for(let i=1;i<timestamps.length;i++){
    const gapSec = (timestamps[i]-timestamps[i-1])/1000;
    if(gapSec>0 && gapSec<900) gaps.push(gapSec);
  }
  const avgRestSec = gaps.length ? Math.round(gaps.reduce(function(a,b){return a+b;},0)/gaps.length) : null;

/* ---------------- friendships ----------------
   One document per pair, keyed by the two normalized names sorted
   alphabetically, so a request can't be duplicated in both directions.
   status is 'pending' until accepted; declining deletes the doc so the
   pair can try again later rather than being blocked forever. */
function pairKey(a,b){ return [norm(a),norm(b)].sort().join('__'); }
function friendshipWith(name){
  const key = pairKey(state.me, name);
  return friendships.find(function(f){ return f.id===key; }) || null;
}
function myFriends(){
  const me = norm(state.me);
  return friendships.filter(function(f){
    return f.status==='accepted' && (norm(f.from)===me || norm(f.to)===me);
  }).map(function(f){
    return norm(f.from)===me ? f.toName : f.fromName;
  }).filter(Boolean);
}
function incomingRequests(){
  const me = norm(state.me);
  return friendships.filter(function(f){ return f.status==='pending' && norm(f.to)===me; });
}
function outgoingRequests(){
  const me = norm(state.me);
  return friendships.filter(function(f){ return f.status==='pending' && norm(f.from)===me; });
}
/* Everyone who has set up a name but isn't already connected to you in
   some way — the one-tap "Add" list. */
function suggestedProfiles(){
  const me = norm(state.me);
  return allProfiles.filter(function(n){
    return norm(n)!==me && !friendshipWith(n);
  });
}
function profileByName(name){
  return allProfiles.find(function(n){ return norm(n)===norm(name); }) || null;
}
async function sendFriendRequest(name){
  if(!state.me || !name || norm(name)===norm(state.me)) return;
  const id = pairKey(state.me, name);
  const doc = { from: norm(state.me), to: norm(name), fromName: state.me, toName: name, status:'pending', ts: Date.now() };
  if(dbApi){
    try{ await dbApi.collection('friendships').doc(id).set(doc); }catch(e){}
  } else {
    friendships = friendships.filter(function(f){ return f.id!==id; });
    friendships.push(Object.assign({id:id}, doc));
    persistLocalFriendships(); render();
  }
}
async function respondToRequest(id, accept){
  if(dbApi){
    try{
      if(accept) await dbApi.collection('friendships').doc(id).update({ status:'accepted' });
      else await dbApi.collection('friendships').doc(id).delete();
    }catch(e){}
  } else {
    if(accept){
      const f = friendships.find(function(x){ return x.id===id; });
      if(f) f.status='accepted';
    } else {
      friendships = friendships.filter(function(x){ return x.id!==id; });
    }
    persistLocalFriendships(); render();
  }
}

/* workoutDayScore()/exerciseHistory() etc. all read the module-level
   `workouts`, which is scoped to whichever profile is "active" — fine
   for your own data or a friend you're viewing, but the Feed shows
   many different friends' entries in one list. This swaps the scope
   in just long enough to compute one score, synchronously, then puts
   it back. */
function scoreForOwnerDate(owner, dateStr){
  const saved = workouts;
  workouts = allWorkouts.filter(function(w){ return norm(w.owner)===norm(owner); });
  const score = workoutDayScore(dateStr);
  workouts = saved;

/* ---------------- streaks ---------------- */
function isoOfDaysBefore(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()-n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* Consecutive calendar days, ending at dateStr, that this owner logged
   at least one workout — used both for the Feed widget's "day streak"
   and for detecting 5/10/15/20-day milestones as they happen. */
function streakForOwner(owner, dateStr){
  const dates = new Set(allWorkouts.filter(function(w){ return norm(w.owner)===norm(owner); }).map(function(w){ return w.date; }));
  if(!dates.size) return 0;
  let streak = 0, cursor = dateStr;
  while(dates.has(cursor)){ streak++; cursor = isoOfDaysBefore(cursor,1); }
  return streak;
}
/* Current streak, tolerant of "haven't logged today yet" — counts from
   today if already logged, otherwise from yesterday, so the flame
   doesn't drop to 0 the instant the calendar rolls over. */
function currentStreak(owner){
  const today = todayISO();
  const todayStreak = streakForOwner(owner, today);
  if(todayStreak>0) return todayStreak;
  return streakForOwner(owner, isoOfDaysBefore(today,1));
}
/* Flame icon with the streak count set inside it — used on the Home
   dashboard and the Feed header. */
function flameBadge(count, size){
  const w = size||34;
  return '<span class="flame-badge" style="width:'+w+'px; height:'+w+'px;">'
    + '<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none">'
    + '<path d="M12 2c1 3-2 4.2-2 7 0 1.4 1 2.5 2 2.5s2-1.1 2-2.5c1.8 1.3 3 3.6 3 5.8 0 3.6-2.7 6.2-7 6.2s-7-2.6-7-6.2C3 10.8 7 8.5 12 2z" fill="url(#flameGrad'+w+')"/>'
    + '<defs><linearGradient id="flameGrad'+w+'" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#ffb84d"/><stop offset="1" stop-color="'+(count>0?'#ff6a3d':'#c8ccd4')+'"/></linearGradient></defs>'
    + '</svg>'
    + '<span class="flame-num" style="font-size:'+Math.round(w*0.36)+'px;">'+count+'</span>'
    + '</span>';
}
const STREAK_MILESTONES = [5,10,15,20];
/* Called right after a new day's first workout is saved — if that day's
   streak just landed exactly on a milestone, posts a notification into
   the shared Feed. Computed from `dateStr` forward rather than relying
   on allWorkouts already reflecting the save (which may not have synced
   back from Firestore yet). */
async function checkStreakMilestone(owner, dateStr){
  const dates = new Set(allWorkouts.filter(function(w){ return norm(w.owner)===norm(owner); }).map(function(w){ return w.date; }));
  dates.add(dateStr);
  let streak = 0, cursor = dateStr;
  while(dates.has(cursor)){ streak++; cursor = isoOfDaysBefore(cursor,1); }
  if(STREAK_MILESTONES.indexOf(streak)===-1) return;
  const event = { type:'streak', owner:owner, days:streak, date:dateStr, ts:Date.now() };
  try{
    if(dbApi){ await dbApi.collection('feedEvents').add(event); }
    else { event.id = uid(); allFeedEvents.unshift(event); persistLocalFeedEvents(); render(); }
  }catch(e){}
}
/* Merged Feed timeline: friends' workouts (as group/duration/streak/
   score widgets) interleaved with streak-milestone notifications,
   newest first. */
function feedItems(){
  const friendSet = {};
  myFriends().forEach(function(f){ friendSet[norm(f)] = true; });
  const workoutItems = allWorkouts.filter(function(w){ return friendSet[norm(w.owner)]; }).map(function(w){
    return { kind:'workout', owner:w.owner, date:w.date, ts:w.ts||0, workout:w };
  });
  const eventItems = allFeedEvents.filter(function(e){ return friendSet[norm(e.owner)]; }).map(function(e){
    return { kind:'streak', owner:e.owner, date:e.date, ts:e.ts||0, days:e.days };
  });
  return workoutItems.concat(eventItems)
    .sort(function(a,b){ if(a.date!==b.date) return a.date<b.date?1:-1; return (b.ts||0)-(a.ts||0); })
    .slice(0,60);
}

/* Lean body mass is the better normalizer for strength comparisons
   than total bodyweight — two lifters at the same weight but different
   body fat % carry different amounts of contractile muscle. Falls back
   to total bodyweight when body fat % isn't provided. */
function leanMassLb(stats){
  if(!stats || !stats.weightLb) return null;
  if(stats.bodyFatPct){ return stats.weightLb * (1 - stats.bodyFatPct/100); }
  return stats.weightLb;
}
/* Bodyweight movements (pull-ups, push-ups, dips) only ever logged
   *added* weight, so a strict bodyweight pull-up counted as zero load
   toward e1RM/PRs/progression — real work that should count. When the
   lifter's weight is on file, the effective load is bodyweight + any
   added weight. */
function effectiveWeight(exerciseId, weight){
  const ex = exById(exerciseId);
  if(ex && ex.bodyweight && myStats && myStats.weightLb){
    return (weight||0) + myStats.weightLb;
  }
  return weight;
}
/* A strict bodyweight set (0 added weight) is a real, complete set —
   the plain "weight && reps" truthiness check used elsewhere treats 0
   as missing, which would make bodyweight sets impossible to ever mark
   complete. Bodyweight exercises only require reps; weight (added
   load) may legitimately be 0. */
function isStrengthSetValid(exerciseId, s){
  const ex = exById(exerciseId);
  if(ex && ex.bodyweight) return !!(s.reps);
  return !!(s.weight && s.reps);
}
/* Relative-strength standards (ratio of e1RM to total bodyweight) for
   the four main compounds, by sex, at Beginner/Novice/Intermediate/
   Advanced/Elite thresholds — aggregated from published strength
   standards (Strength Level's lift database, cross-checked against
   NSCA/Barbell Medicine figures). Bodyweight ratios are the
   conventional unit these are published in. */
const STRENGTH_STANDARDS = {
  back_squat:  { male:[0.75,1.0,1.75,2.5,3.0],  female:[0.5,0.75,1.25,1.75,2.25] },
  bench_press: { male:[0.5,0.75,1.0,1.5,1.75],  female:[0.3,0.5,0.75,1.0,1.25] },
  deadlift:    { male:[1.0,1.5,2.0,2.5,3.0],    female:[0.6,1.0,1.25,1.75,2.25] },
  ohp:         { male:[0.35,0.5,0.75,1.0,1.25], female:[0.2,0.35,0.5,0.7,0.9] }
};
const STRENGTH_LEVEL_NAMES = ['Untrained','Beginner','Novice','Intermediate','Advanced','Elite'];
function strengthLevelForLift(exerciseId, e1rmVal, stats){
  const table = STRENGTH_STANDARDS[exerciseId];
  if(!table || !stats || !stats.weightLb || !e1rmVal) return null;
  const sexKey = stats.sex==='female' ? 'female' : 'male';
  const ratio = e1rmVal / stats.weightLb;
  const thresholds = table[sexKey];
  let levelIdx = 0;
  for(let i=0;i<thresholds.length;i++){ if(ratio>=thresholds[i]) levelIdx = i+1; }
  return { levelIdx:levelIdx, levelName:STRENGTH_LEVEL_NAMES[levelIdx], ratio:ratio };
}
/* Average relative-strength level (0=untrained .. 5=elite) across
   whichever main compounds have enough history — used to calibrate
   how much e1RM growth "counts" as good progress. Progression rate
   naturally slows with training status; a beginner should show bigger
   raw gains to score well, an advanced lifter shouldn't be held to
   that same bar. Returns null when there's no bodyweight on file or
   no main-lift history yet, so callers can fall back to a neutral
   default instead of guessing. */
function myAvgStrengthLevel(){
  if(!myStats || !myStats.weightLb) return null;
  const levels = [];
  Object.keys(STRENGTH_STANDARDS).forEach(function(id){
    const hist = exerciseHistory(id);
    if(!hist.length) return;
    const best = hist.reduce(function(m,h){ return Math.max(m,h.e1rm); },0);
    const lvl = strengthLevelForLift(id, best, myStats);
    if(lvl) levels.push(lvl.levelIdx);
  });
  if(!levels.length) return null;
  return levels.reduce(function(a,b){ return a+b; },0)/levels.length;
}

/* Training goal calibrates the same four levers research treats
   differently by objective: how much weekly volume to target per
   muscle group, how heavy sets should feel (ideal Strain / %1RM),
   and how aggressively to bump weight on progression.
   - Build Muscle: higher volume (closer to MAV), moderate intensity —
     classic hypertrophy programming.
   - Get Stronger: lower volume, very high intensity, bigger load jumps
     — a powerlifting-style bias toward near-max singles/triples.
   - Lose Fat / Lean Out: baseline volume, moderate intensity — keep
     lifting hard enough to preserve muscle while cardio/diet do the
     rest; smaller load jumps since the priority isn't chasing PRs.
   - Improve Endurance: lower load intensity, slightly reduced strength
     volume (cardio work isn't tracked here but is presumably filling
     the gap), smaller jumps.
   - Stay in Shape: moderate everything — general health, not chasing
     a specific adaptation. Also the default when no goal is set, tuned
     to match this app's pre-goal-feature behavior exactly, so picking
     no goal never changes anything. */
const GOAL_PROFILES = {
  muscle:    { label:'Build Muscle',         volumeMult:1.15, idealStrain:8.5, idealPct:0.82, bumpMult:1.0  },
  strength:  { label:'Get Stronger',         volumeMult:0.85, idealStrain:9.2, idealPct:0.88, bumpMult:1.2  },
  fatloss:   { label:'Lose Fat / Lean Out',  volumeMult:1.0,  idealStrain:7.75,idealPct:0.78, bumpMult:0.8  },
  endurance: { label:'Improve Endurance',    volumeMult:0.85, idealStrain:7.0, idealPct:0.70, bumpMult:0.8  },
  maintain:  { label:'Stay in Shape',        volumeMult:1.0,  idealStrain:8.25,idealPct:0.82, bumpMult:1.0  }
};
function myGoalProfile(){
  const key = myStats && myStats.goal;
  return (key && GOAL_PROFILES[key]) ? GOAL_PROFILES[key] : GOAL_PROFILES.maintain;
}

/* ---------------- scoring ---------------- */
function entriesInWindow(days){
  const cutoff = days;
  return workouts.filter(function(w){ return daysAgo(w.date) <= cutoff; });
}
/* Training volume as the research actually measures it — hard sets,
   not tonnage. "~10 sets/muscle group/week" is the standard unit in
   the hypertrophy literature; total weight lifted rewards heavy
   singles the same as high-rep sets and conflates load with work
   done. Weight is already captured separately by Intensity and
   Progressive Overload. Counts working (strength) sets only — cardio
   volume is tracked in minutes elsewhere. */
function totalVolume(w){
  let sets=0;
  (w.entries||[]).forEach(function(en){
    const ex = exById(en.exerciseId);
    if(ex && ex.cardio) return;
    sets += (en.sets||[]).filter(function(s){ return isStrengthSetValid(en.exerciseId,s); }).length;
  });
  return sets;
}
function groupsHit(w){
  const gs = new Set();
  (w.entries||[]).forEach(function(en){ const ex=exById(en.exerciseId); if(ex) gs.add(ex.group); });
  return gs;
}
/* Weekly working-set landmarks by muscle group (hypertrophy literature
   MEV/MAV ballpark) — bigger groups like Back tolerate and need more
   volume than small groups like Biceps/Triceps or Core, so one blanket
   sets target across the whole body isn't accurate for any of them.
   Biceps/Triceps and Quads/Hamstrings/Glutes/Calves are tracked
   separately rather than lumped into "Arms"/"Legs" — they're different
   muscles worked by different exercises, and a squat-only day
   shouldn't read as having also trained hamstrings. Calves sit higher
   than other small groups since they're notoriously slow-responding
   and conventionally programmed with more volume. */
const GROUP_WEEKLY_SET_TARGET = { Chest:12, Back:14, Quads:12, Hamstrings:10, Glutes:10, Calves:12, Shoulders:12, Biceps:8, Triceps:8, Core:8 };
function groupSetsInWorkout(w, group){
  let sets=0;
  (w.entries||[]).forEach(function(en){
    const ex = exById(en.exerciseId);
    if(ex && !ex.cardio && ex.group===group) sets += (en.sets||[]).filter(function(s){ return isStrengthSetValid(en.exerciseId,s); }).length;
  });
  return sets;
}
/* Per-group session baseline: average sets logged for this group on
   past sessions (within 28 days) that also trained it, falling back to
   half the weekly landmark (assuming ~2x/week frequency) when there's
   no history for that group yet. */
function groupSessionBaseline(group, dateStr){
  const prior = workouts.filter(function(w){ const d=dateDiffDays(dateStr,w.date); return d>0 && d<=28 && groupSetsInWorkout(w,group)>0; });
  if(!prior.length) return (GROUP_WEEKLY_SET_TARGET[group]||10)/2 * myGoalProfile().volumeMult;
  return prior.reduce(function(s,w){ return s+groupSetsInWorkout(w,group); },0)/prior.length;
}
/* Group-relative volume: each muscle group hit that day is scored
   against its OWN baseline/target, then averaged — so a leg day isn't
   judged against an arms-day set count and vice versa. Returns null
   when no trackable strength group was hit (e.g. cardio-only day). */
function groupRelativeVolume(w, dateStr){
  const groups = Array.from(groupsHit(w)).filter(function(g){ return GROUP_WEEKLY_SET_TARGET.hasOwnProperty(g); });
  if(!groups.length) return null;
  const breakdown = groups.map(function(g){
    const sets = groupSetsInWorkout(w,g);
    const baseline = groupSessionBaseline(g,dateStr);
    return { group:g, sets:sets, baseline:baseline, score:ratioScore(sets,baseline) };
  });
  const score = breakdown.reduce(function(s,b){ return s+b.score; },0)/breakdown.length;
  return { score:score, breakdown:breakdown };
}
function avgRpe(w){
  let sum=0,n=0;
  (w.entries||[]).forEach(function(en){ (en.sets||[]).forEach(function(s){ if(s.rpe){ sum+=s.rpe; n++; } }); });
  return n? sum/n : null;
}

function cardioMinutes(w){
  let m=0;
  (w.entries||[]).forEach(function(en){
    const ex = exById(en.exerciseId);
    if(ex && ex.cardio){ (en.sets||[]).forEach(function(s){ m += (s.minutes||0); }); }
  });
  return m;
}
/* Scores `current` against a trailing baseline: 100 in the ideal
   slight-overload zone (100-115% of baseline), falling off on either
   side. A baseline under 1 means "no history yet" — give a neutral
   score for showing up rather than 0. */
function ratioScore(current, baseline){
  if(baseline < 1) return current>0 ? 68 : 0;
  const ratio = current/baseline;
  if(ratio>=1.0 && ratio<=1.15) return 100;
  if(ratio<1.0) return clamp(100-(1.0-ratio)*180, 0, 100);
  return clamp(100-(ratio-1.15)*140, 0, 100);
}
/* Volume score that counts BOTH currencies training produces: working
   sets for strength and minutes for cardio. Whichever ones you actually
   did this period get scored against their own baseline and averaged,
   so a cardio-only week scores on cardio, not on the lb volume it
   will never move. */
function blendedVolumeScore(strengthNow, strengthBase, cardioNow, cardioBase){
  const hasStrength = strengthNow>0, hasCardio = cardioNow>0;
  if(hasStrength && hasCardio) return (ratioScore(strengthNow,strengthBase) + ratioScore(cardioNow,cardioBase))/2;
  if(hasCardio) return ratioScore(cardioNow,cardioBase);
  if(hasStrength) return ratioScore(strengthNow,strengthBase);
  return 0;
}
/* Frequency, research-aligned: current guidance targets each muscle
   group at least twice a week, not just "N workouts" — a 4-day split
   that never repeats a muscle group scores worse here than 3 full-body
   days would, which matches the evidence better than a raw session
   count. */
function groupFrequencyScore(){
  const recent = entriesInWindow(7);
  const counts = {};
  GROUP_ORDER.forEach(function(g){ counts[g] = 0; });
  recent.forEach(function(w){
    const hitToday = {};
    (w.entries||[]).forEach(function(en){
      const ex = exById(en.exerciseId);
      if(ex && !ex.cardio && counts.hasOwnProperty(ex.group)) hitToday[ex.group] = true;
    });
    Object.keys(hitToday).forEach(function(g){ counts[g]++; });
  });
  const perGroup = GROUP_ORDER.map(function(g){ return clamp((counts[g]/2)*100, 0, 100); });
  return Math.round(perGroup.reduce(function(a,b){ return a+b; },0)/perGroup.length);
}
/* Progressive overload: are your lifts' estimated 1RMs trending up
   over the last 5 weeks? This is the single most-cited driver of
   results in the research and previously had zero presence in the
   score — the app recommended progression per-exercise but never
   checked whether it was actually happening. */
function progressiveOverloadScore(){
  const cutoffDays = 35;
  const byExercise = {};
  workouts.forEach(function(w){
    if(daysAgo(w.date) > cutoffDays) return;
    (w.entries||[]).forEach(function(en){
      const ex = exById(en.exerciseId);
      if(!ex || ex.cardio) return;
      const top = (en.sets||[]).reduce(function(m,s){ return Math.max(m, e1rm(effectiveWeight(en.exerciseId,s.weight),s.reps)); }, 0);
      if(top<=0) return;
      (byExercise[en.exerciseId] = byExercise[en.exerciseId]||[]).push({date:w.date, e1rm:top});
    });
  });
  const ratios = [];
  Object.keys(byExercise).forEach(function(id){
    const hist = byExercise[id].sort(function(a,b){ return a.date<b.date?-1:1; });
    if(hist.length<2) return;
    if(hist[0].e1rm>0) ratios.push(hist[hist.length-1].e1rm/hist[0].e1rm);
  });
  if(!ratios.length) return null;
  const avgRatio = ratios.reduce(function(a,b){ return a+b; },0)/ratios.length;
  /* Progression rate naturally slows with training status — a beginner
     should show bigger raw e1RM gains to score well, but holding an
     advanced lifter to that same bar is unrealistic and not what the
     research shows. When bodyweight+sex are on file, relative-strength
     level scales how sensitive the score is to a given ratio change:
     the same small gain that barely moves a beginner's score can max
     out an advanced lifter's. */
  const avgLevel = myAvgStrengthLevel();
  const sensitivity = avgLevel===null ? 700 : 700*(1+avgLevel*0.45);
  return Math.round(clamp(50 + (avgRatio-1)*sensitivity, 0, 100));
}
/* Consistency: adherence is the strongest real-world predictor per
   ACSM ("the best program is the one you stick with") — this rewards
   showing up across a longer window, separate from any single week's
   numbers. */
function consistencyScore(){
  let weeksWithWorkout = 0;
  for(let w=0; w<4; w++){
    const hasOne = workouts.some(function(wk){ const d=daysAgo(wk.date); return d>=w*7 && d<(w+1)*7; });
    if(hasOne) weeksWithWorkout++;
  }
  return Math.round((weeksWithWorkout/4)*100);
}
/* Recovery: the newest guidelines treat under-recovery as a real risk,
   not just "more is always better" — this only dings training every
   single day of the window with zero rest, and lightly at that. */
function recoveryScore(recentCount){
  const daysWithWorkout = new Set(entriesInWindow(7).map(function(w){ return w.date; })).size;
  if(daysWithWorkout===0) return 0;
  if(daysWithWorkout>=7) return 60;
  return 100;
}
/* Cardio isn't judged by the same "push toward failure" standard as a
   lifting set. ACSM/WHO physical-activity guidelines (and the FITT-VP
   framework built on them) are anchored on "moderate-to-vigorous"
   intensity — on the Borg CR-10 perceived-exertion scale this app's
   1-10 Strain field already implements, that's roughly a 4-8 band,
   not a peak to chase every session. So the cardio ideal sits lower
   than lifting's near-failure target, and the falloff is gentler
   since moderate-to-vigorous is a wide zone, not a point. */
const CARDIO_IDEAL_STRAIN = 6, CARDIO_STRAIN_FALLOFF = 14;
function cardioIntensityScore(avgStrain){
  return clamp(100 - Math.abs(avgStrain-CARDIO_IDEAL_STRAIN)*CARDIO_STRAIN_FALLOFF, 0, 100);
}
function sevenDayScore(){
  const recent = entriesInWindow(7);
  const prior = entriesInWindow(35).filter(function(w){ return daysAgo(w.date) > 7; });
  const freqScore = groupFrequencyScore();
  // volume vs trailing 4wk weekly average — strength (lb) and cardio (min) each scored on their own baseline, then blended
  const priorWeeks = 4;
  const recentStrengthVol = recent.reduce(function(s,w){ return s+totalVolume(w); },0);
  const priorStrengthVol = prior.reduce(function(s,w){ return s+totalVolume(w); },0);
  const recentCardioMin = recent.reduce(function(s,w){ return s+cardioMinutes(w); },0);
  const priorCardioMin = prior.reduce(function(s,w){ return s+cardioMinutes(w); },0);
  const volScore = blendedVolumeScore(recentStrengthVol, priorStrengthVol/priorWeeks, recentCardioMin, priorCardioMin/priorWeeks);
  // intensity: strength sets scored against the goal's Strain/%1RM target, cardio sets scored against the ACSM moderate-to-vigorous band, then blended
  let rpeSum=0, rpeN=0, pctSum=0, pctN=0, cardioRpeSum=0, cardioRpeN=0;
  recent.forEach(function(w){
    (w.entries||[]).forEach(function(en){
      const ex = exById(en.exerciseId);
      if(ex && ex.cardio){
        (en.sets||[]).forEach(function(s){ if(s.rpe){ cardioRpeSum+=s.rpe; cardioRpeN++; } });
        return;
      }
      const best = bestE1rmEver(en.exerciseId, w.date);
      (en.sets||[]).forEach(function(s){
        if(s.rpe){ rpeSum+=s.rpe; rpeN++; }
        else if(best>0 && s.weight){ pctSum += (effectiveWeight(en.exerciseId,s.weight)/best); pctN++; }
      });
    });
  });
  const goalP = myGoalProfile();
  let strengthIntensity = null, cardioIntensity = null;
  if(rpeN) strengthIntensity = clamp(100 - Math.abs(rpeSum/rpeN-goalP.idealStrain)*28, 0, 100);
  else if(pctN) strengthIntensity = clamp(100 - Math.abs(pctSum/pctN-goalP.idealPct)*220, 0, 100);
  if(cardioRpeN) cardioIntensity = cardioIntensityScore(cardioRpeSum/cardioRpeN);
  let intensityScore;
  if(strengthIntensity!==null && cardioIntensity!==null) intensityScore = (strengthIntensity+cardioIntensity)/2;
  else if(cardioIntensity!==null) intensityScore = cardioIntensity;
  else if(strengthIntensity!==null) intensityScore = strengthIntensity;
  else intensityScore = recent.length ? 60 : 0;
  const overloadRaw = progressiveOverloadScore();
  const overloadScore = overloadRaw===null ? 60 : overloadRaw;
  const consistency = consistencyScore();
  const recovery = recoveryScore();

  const total = recent.length===0 ? 0 : Math.round(
    freqScore*0.20 + volScore*0.20 + intensityScore*0.20 + overloadScore*0.15 + consistency*0.15 + recovery*0.10
  );
  return {
    total,
    freqScore:Math.round(freqScore),
    volScore:Math.round(volScore),
    intensityScore:Math.round(intensityScore),
    overloadScore:Math.round(overloadScore),
    consistency:Math.round(consistency),
    recovery:Math.round(recovery),
    count:recent.length
  };
}

/* Single-session score for the calendar: how hard (Strain) and how much
   (volume vs your trailing 4-week average session) that day's work was.
   No frequency/balance component here — those only mean something over
   a window, not a single day. */
function workoutDayScoreParts(dateStr){
  const dayWorkouts = workouts.filter(function(w){ return w.date===dateStr; });
  if(!dayWorkouts.length) return null;
  const entries = [].concat.apply([], dayWorkouts.map(function(w){ return w.entries||[]; }));
  const merged = { date:dateStr, entries:entries };
  const strengthVol = totalVolume(merged);
  const cardioMin = cardioMinutes(merged);

  const priorSessions = workouts.filter(function(w){ const d=dateDiffDays(dateStr,w.date); return d>0 && d<=28; });
  const groupVol = groupRelativeVolume(merged, dateStr);
  let volScore, avgSessionCardioMin=null;
  if(!priorSessions.length && groupVol===null){
    volScore = (strengthVol>0 || cardioMin>0) ? 70 : 0;
  } else {
    avgSessionCardioMin = priorSessions.length ? priorSessions.reduce(function(s,w){ return s+cardioMinutes(w); },0)/priorSessions.length : null;
    const hasStrength = strengthVol>0 && groupVol!==null, hasCardio = cardioMin>0 && avgSessionCardioMin!==null;
    if(hasStrength && hasCardio) volScore = (groupVol.score + ratioScore(cardioMin, avgSessionCardioMin))/2;
    else if(hasCardio) volScore = ratioScore(cardioMin, avgSessionCardioMin);
    else if(hasStrength) volScore = groupVol.score;
    else volScore = (strengthVol>0 || cardioMin>0) ? 70 : 0;
  }

  let strainSum=0, strainN=0, pctSum=0, pctN=0, cardioStrainSum=0, cardioStrainN=0;
  entries.forEach(function(en){
    const ex = exById(en.exerciseId);
    if(ex && ex.cardio){
      (en.sets||[]).forEach(function(s){ if(s.rpe){ cardioStrainSum+=s.rpe; cardioStrainN++; } });
      return;
    }
    const best = bestE1rmEver(en.exerciseId, dateStr);
    (en.sets||[]).forEach(function(s){
      if(s.rpe){ strainSum+=s.rpe; strainN++; }
      else if(best>0 && s.weight){ pctSum += effectiveWeight(en.exerciseId,s.weight)/best; pctN++; }
    });
  });
  const goalP = myGoalProfile();
  let strengthIntensity=null, strainAvg=null, pctAvg=null;
  if(strainN){ strainAvg = strainSum/strainN; strengthIntensity = clamp(100-Math.abs(strainAvg-goalP.idealStrain)*28, 0, 100); }
  else if(pctN){ pctAvg = pctSum/pctN; strengthIntensity = clamp(100-Math.abs(pctAvg-goalP.idealPct)*220, 0, 100); }
  const cardioStrainAvg = cardioStrainN ? cardioStrainSum/cardioStrainN : null;
  const cardioIntensity = cardioStrainAvg!==null ? cardioIntensityScore(cardioStrainAvg) : null;
  let intensityScore;
  if(strengthIntensity!==null && cardioIntensity!==null) intensityScore = (strengthIntensity+cardioIntensity)/2;
  else if(cardioIntensity!==null) intensityScore = cardioIntensity;
  else if(strengthIntensity!==null) intensityScore = strengthIntensity;
  else intensityScore = 60;

  const total = Math.round(volScore*0.5 + intensityScore*0.5);
  return {
    total, volScore:Math.round(volScore), intensityScore:Math.round(intensityScore),
    strengthVol, cardioMin, avgSessionCardioMin, strainAvg, pctAvg, cardioStrainAvg, goalP,
    groupBreakdown: groupVol ? groupVol.breakdown : null
  };
}
function workoutDayScore(dateStr){
  const p = workoutDayScoreParts(dateStr);
  return p ? p.total : null;
}
/* Plain-language version of "what's holding this workout's score back,
   and what would fix it" — built from the same two factors (Volume,
   Intensity) that make up the score itself, so the advice always
   matches the number shown. */
function workoutRecommendation(dateStr){
  const p = workoutDayScoreParts(dateStr);
  if(!p) return null;
  if(p.total>=75) return { green:true, tips:[] };
  const tips = [];
  if(p.volScore < 75){
    if(p.avgSessionCardioMin===null && !p.groupBreakdown){
      tips.push('Volume: not enough history yet to compare against — this sharpens up after a few more sessions.');
    } else if(p.cardioMin>0 && p.strengthVol<=0){
      const target = p.avgSessionCardioMin;
      if(p.cardioMin < target){
        tips.push('Volume: '+Math.round(p.cardioMin)+' min logged vs. your usual ~'+Math.round(target)+' min — about '+Math.max(1,Math.round(target-p.cardioMin))+' more minutes would move this into the green.');
      } else {
        tips.push('Volume: well above your usual ~'+Math.round(target)+' min — strong effort, but that size of jump scores lower here than a steadier increase would.');
      }
    } else if(p.groupBreakdown && p.groupBreakdown.length){
      const short = p.groupBreakdown.filter(function(b){ return b.score<75; }).sort(function(a,b){ return a.score-b.score; });
      if(!short.length){
        tips.push('Volume: every muscle group you hit today is at or above its usual set count — this factor is already scoring well.');
      } else {
        short.forEach(function(b){
          if(b.sets < b.baseline){
            const deltaSets = Math.max(1, Math.round(b.baseline - b.sets));
            tips.push(b.group+': '+b.sets+' set'+(b.sets===1?'':'s')+' vs. your usual ~'+Math.round(b.baseline)+' for that group — about '+deltaSets+' more working set'+(deltaSets===1?'':'s')+' gets it into the green.');
          } else {
            tips.push(b.group+': well above your usual ~'+Math.round(b.baseline)+' sets for that group — a strong hit, but that big a jump scores lower here than a steadier increase would.');
          }
        });
      }
    }
  }
  if(p.intensityScore < 75){
    const goalP = p.goalP || myGoalProfile();
    if(p.strainAvg!==null){
      if(p.strainAvg < goalP.idealStrain){
        tips.push('Lifting intensity: average Strain was '+p.strainAvg.toFixed(1)+' — for your '+goalP.label.toLowerCase()+' goal, pushing closer to '+goalP.idealStrain.toFixed(1)+' would move this into the green.');
      } else {
        tips.push('Lifting intensity: average Strain was '+p.strainAvg.toFixed(1)+' — a bit above the '+goalP.idealStrain.toFixed(1)+' target for your goal. Backing off slightly protects recovery without costing much here.');
      }
    } else if(p.pctAvg!==null){
      const pct = Math.round(p.pctAvg*100), idealPct = Math.round(goalP.idealPct*100);
      if(p.pctAvg < goalP.idealPct){
        tips.push('Lifting intensity: sets averaged about '+pct+'% of your best lift — working closer to '+idealPct+'% (or logging Strain instead) would score higher for your goal.');
      } else {
        tips.push('Lifting intensity: sets averaged about '+pct+'% of your best lift — above the ~'+idealPct+'% target for your goal. A touch lighter is fine and easier to recover from.');
      }
    } else if(p.strengthVol>0){
      tips.push('Lifting intensity: log a Strain rating (1-10) on your sets — right now there\'s nothing to score effort against, so it defaults to neutral.');
    }
    /* Cardio is judged against the ACSM moderate-to-vigorous band
       (Strain ~4-8), not the same near-failure target as lifting —
       chasing an 8+ on every cardio session isn't the guideline and
       isn't what the score is looking for here. */
    if(p.cardioStrainAvg!==null){
      if(p.cardioStrainAvg < 4){
        tips.push('Cardio intensity: average Strain was '+p.cardioStrainAvg.toFixed(1)+' — that\'s light-intensity. Picking up the pace into the moderate-to-vigorous range (Strain 4-8, the ACSM guideline for aerobic benefit) would score higher.');
      } else if(p.cardioStrainAvg > 8){
        tips.push('Cardio intensity: average Strain was '+p.cardioStrainAvg.toFixed(1)+' — that\'s near-maximal effort, harder than the moderate-to-vigorous range (Strain 4-8) aerobic guidelines call for. Easing off slightly is easier to sustain and recover from.');
      }
    } else if(p.cardioMin>0){
      tips.push('Cardio intensity: log a Strain rating (1-10) on your cardio sets — right now there\'s nothing to score effort against, so it defaults to neutral.');
    }
  }
  return { green:false, tips: tips };
}

function bestE1rmEver(exerciseId, beforeDate){
  let best=0;
  workouts.forEach(function(w){
    if(beforeDate && w.date>beforeDate) return;
    (w.entries||[]).forEach(function(en){
      if(en.exerciseId!==exerciseId) return;
      (en.sets||[]).forEach(function(s){ const v=e1rm(effectiveWeight(exerciseId,s.weight),s.reps); if(v>best) best=v; });
    });
  });
  return best;
}
function exerciseHistory(exerciseId){
  const hist = [];
  workouts.forEach(function(w){
    (w.entries||[]).forEach(function(en){
      if(en.exerciseId!==exerciseId) return;
      const top = (en.sets||[]).reduce(function(m,s){ return Math.max(m, e1rm(effectiveWeight(exerciseId,s.weight),s.reps)); }, 0);
      const vol = (en.sets||[]).reduce(function(s2,s){ return s2 + (s.weight||0)*(s.reps||0); }, 0);
      hist.push({ date:w.date, e1rm:top, sets:en.sets, volume:vol });
    });
  });
  hist.sort(function(a,b){ return a.date<b.date?-1:1; });
  return hist;
}
function exercisePerformanceScore(exerciseId){
  const hist = exerciseHistory(exerciseId);
  if(hist.length===0) return null;
  const allTimeBest = hist.reduce(function(m,h){ return Math.max(m,h.e1rm); },0);
  if(hist.length<3) return { score:null, label:'Building baseline', sessions:hist.length };
  const last = hist[hist.length-1];
  const ratio = allTimeBest>0 ? last.e1rm/allTimeBest : 0;
  const score = Math.round(clamp(ratio,0,1)*100);
  return { score, label: ratio>=0.995 ? 'Personal best' : (ratio>=0.9?'Near peak':'Below peak'), sessions:hist.length };
}

/* All-time best set (by estimated 1RM) for every exercise you've ever
   logged, newest PR first. */
function allPRs(){
  const list = [];
  allExercises().forEach(function(ex){
    if(ex.cardio) return;
    const hist = exerciseHistory(ex.id);
    if(!hist.length) return;
    let best = null;
    hist.forEach(function(h){
      if(!h.sets || !h.sets.length) return;
      const topSet = h.sets.reduce(function(m,s){ return e1rm(s.weight,s.reps) > e1rm(m.weight,m.reps) ? s : m; }, h.sets[0]);
      const v = e1rm(effectiveWeight(ex.id,topSet.weight), topSet.reps);
      if(!best || v>best.e1rm) best = { date:h.date, weight:topSet.weight, reps:topSet.reps, e1rm:v };
    });
    if(best) list.push({ ex:ex, best:best });
  });
  list.sort(function(a,b){ return a.best.date<b.best.date ? 1 : -1; });
  return list;
}

/* ---------------- per-group tracking insights ---------------- */
function groupLastTrainedDate(group){
  let last = null;
  workouts.forEach(function(w){ if(groupsHit(w).has(group) && (!last || w.date>last)) last = w.date; });
  return last;
}
/* 0-100 "how hard has this muscle group been worked lately" — averages
   logged Strain across the window, falling back to %e1RM when Strain
   wasn't logged. Null means the group hasn't been touched at all. */
function groupStrain(group, days){
  const cutoff = days || 7;
  let strainSum=0, strainN=0, pctSum=0, pctN=0, any=false;
  workouts.forEach(function(w){
    if(daysAgo(w.date) > cutoff) return;
    (w.entries||[]).forEach(function(en){
      const ex = exById(en.exerciseId);
      if(!ex || ex.group!==group) return;
      const best = bestE1rmEver(en.exerciseId, w.date);
      (en.sets||[]).forEach(function(s){
        any = true;
        if(s.rpe){ strainSum+=s.rpe; strainN++; }
        else if(best>0 && s.weight){ pctSum += effectiveWeight(en.exerciseId,s.weight)/best; pctN++; }
      });
    });
  });
  if(!any) return null;
  if(strainN) return Math.round(clamp(strainSum/strainN*10, 0, 100));
  if(pctN) return Math.round(clamp(pctSum/pctN*100, 0, 100));
  return 40;
}
function strainColor(score){
  if(score===null) return 'var(--surface-2)';
  if(score>=67) return 'var(--bad)';
  if(score>=34) return 'var(--warn)';
  return 'var(--accent)';
}
function groupWeeklyVolume(group, weeksAgo){
  const lo = weeksAgo*7, hi = (weeksAgo+1)*7;
  return workouts.filter(function(w){ const d=daysAgo(w.date); return d>=lo && d<hi; })
    .reduce(function(sum,w){
      let sets=0;
      (w.entries||[]).forEach(function(en){
        const ex = exById(en.exerciseId);
        if(ex && ex.group===group){ sets += (en.sets||[]).filter(function(s){ return isStrengthSetValid(en.exerciseId,s); }).length; }
      });
      return sum+sets;
    }, 0);
}

/* How big a jump to recommend when it's time to add weight. Novices
   reliably progress faster than trained lifters (the well-established
   "newbie gains" effect), so a beginner gets a bigger jump; someone
   already at an advanced relative-strength level gets a smaller, more
   conservative one. Falls back to 1x (today's flat behavior) with no
   bodyweight on file, or for lifts outside the four with published
   standards, using the lifter's overall average level instead. */
function progressionBumpMultiplier(exerciseId){
  const goalMult = myGoalProfile().bumpMult;
  if(!myStats || !myStats.weightLb) return goalMult;
  let levelIdx = null;
  const table = STRENGTH_STANDARDS[exerciseId];
  if(table){
    const lvl = strengthLevelForLift(exerciseId, bestE1rmEver(exerciseId), myStats);
    if(lvl) levelIdx = lvl.levelIdx;
  }
  if(levelIdx===null){
    const avg = myAvgStrengthLevel();
    if(avg===null) return goalMult;
    levelIdx = Math.round(avg);
  }
  let mult = 1;
  if(levelIdx<=1) mult = 1.8;
  else if(levelIdx>=4) mult = 0.5;
  return mult*goalMult;
}
/* The rep range a recommendation should target: the exercise's own
   library range by default, or — once a goal is set — the goal's
   rep prescription for that exercise's type. Without this, the
   "Suggested next" hint could tell someone chasing hypertrophy
   (8-10 reps) to drop back to 5 reps just because that's bench
   press's own hardcoded low-rep default, contradicting the goal-based
   Suggested Workout card sitting right above it. */
function goalRepRange(ex){
  if(!myStats || !myStats.goal) return { lo:ex.repLow, hi:ex.repHigh };
  const presc = GOAL_PRESCRIPTION[myGoalKey()];
  const p = presc[ex.type] || presc.compound;
  return { lo:p.repLo, hi:p.repHi };
}
function recommendation(exerciseId){
  const ex = exById(exerciseId);
  if(!ex || ex.cardio) return null;
  const hist = exerciseHistory(exerciseId);
  if(hist.length===0) return null;
  const last = hist[hist.length-1];
  const sets = last.sets||[];
  if(!sets.length) return null;
  const range = goalRepRange(ex);
  const topWeight = Math.max.apply(null, sets.map(function(s){ return s.weight||0; }));
  const topSets = sets.filter(function(s){ return s.weight===topWeight; });
  const allHitTop = topSets.length>0 && topSets.every(function(s){ return s.reps>=range.hi; });
  const rpes = sets.map(function(s){ return s.rpe; }).filter(Boolean);
  const avgR = rpes.length ? rpes.reduce(function(a,b){return a+b;},0)/rpes.length : null;
  const anyFailedLow = sets.some(function(s){ return s.reps < range.lo-1; });
  const overloaded = avgR!==null && avgR>=9.3;

  if(anyFailedLow || overloaded){
    const w = roundToStep(topWeight*0.95, ex.type==='compound'?2.5:1);
    return { weight:w, reps:range.lo, note:'Recovery dip last time — easing the load ~5% and resetting to the bottom of your rep range.' };
  }
  if(allHitTop && (avgR===null || avgR<=8.3)){
    const baseBump = ex.type==='compound' ? 2.5 : (topWeight>=50?2.5:1);
    const mult = progressionBumpMultiplier(exerciseId);
    const bump = Math.max(0.5, Math.round(baseBump*mult*2)/2);
    const w = roundToStep(topWeight+bump, 0.5);
    const levelNote = mult>1 ? ' You\'re early on this lift, so progress can come faster here.' : mult<1 ? ' Smaller, steadier jumps make sense at your current strength level.' : '';
    return { weight:w, reps:range.lo, note:'Every set hit '+range.hi+'+ reps comfortably — add '+bump+' lb and drop back to '+range.lo+' reps.'+levelNote };
  }
  const bestSet = sets.reduce(function(m,s){ return s.reps>m.reps?s:m; }, sets[0]);
  const nextReps = Math.min(range.hi, (bestSet.reps||range.lo)+1);
  return { weight:topWeight, reps:nextReps, note:'Same weight as last time — chase '+nextReps+' reps before adding load.' };
}

function lastPerformedSummary(exerciseId){
  const ex = exById(exerciseId);
  const hist = exerciseHistory(exerciseId);
  if(!hist.length) return null;
  const last = hist[hist.length-1];
  if(ex && ex.cardio){
    const top = last.sets.reduce(function(m,s){ return (s.minutes||0)>=(m.minutes||0)? s : m; }, last.sets[0]);
    return (top.minutes||0)+' min'+(top.distance?', '+top.distance+' mi':'');
  }
  const top = last.sets.reduce(function(m,s){ return (s.weight||0)>=(m.weight||0)? s : m; }, last.sets[0]);
  return last.sets.length+'×'+top.reps+' @ '+top.weight+' lb';
}

/* ---------------- suggested workout engine ---------------- */
/* Sets/reps/intensity by goal, following the NSCA loading continuum
   (Baechle & Earle, Essentials of Strength Training and Conditioning):
   roughly 1-6 reps at 85-100% 1RM for max strength, 6-12 reps at
   67-85% for hypertrophy, 12-20+ reps at <67% for muscular endurance.
   RPE targets mirror the goal's own idealStrain from GOAL_PROFILES so
   the plan and the scoring agree with each other. Compounds and
   isolations get separate prescriptions since accessories are
   conventionally kept a bit higher-rep than the main lift even on a
   strength-focused day. */
const GOAL_PRESCRIPTION = {
  muscle:    { compound:{sets:4, repLo:8,  repHi:10, rpe:7.5}, isolation:{sets:3, repLo:10, repHi:12, rpe:7.5} },
  strength:  { compound:{sets:4, repLo:3,  repHi:5,  rpe:8.5}, isolation:{sets:3, repLo:8,  repHi:10, rpe:7}   },
  fatloss:   { compound:{sets:3, repLo:10, repHi:12, rpe:7},   isolation:{sets:3, repLo:12, repHi:15, rpe:7}   },
  endurance: { compound:{sets:3, repLo:12, repHi:15, rpe:6.5}, isolation:{sets:2, repLo:15, repHi:20, rpe:6}   },
  maintain:  { compound:{sets:3, repLo:8,  repHi:10, rpe:7},   isolation:{sets:3, repLo:10, repHi:12, rpe:7}   }
};
function myGoalKey(){ return (myStats && myStats.goal && GOAL_PROFILES[myStats.goal]) ? myStats.goal : 'maintain'; }
/* ---------------- gauge svg ---------------- */
function gaugeSvg(score){
  const R=120, CX=150, CY=150;
  const startX = CX-R, endX = CX+R;
  const path = 'M '+startX+' '+CY+' A '+R+' '+R+' 0 1 1 '+endX+' '+CY;
  const color = score>=70 ? 'var(--good)' : score>=40 ? 'var(--warn)' : 'var(--bad)';
  return '<svg class="gauge-svg" viewBox="0 0 300 168" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="'+path+'" fill="none" stroke="var(--surface-2)" stroke-width="16" stroke-linecap="round" pathLength="100"/>'
    + '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="'+(100-score)+'" style="transition:stroke-dashoffset .6s ease"/>'
    + '</svg>';
}

function renderCalendar(){
  const today = new Date(); today.setHours(0,0,0,0);
  const startDate = new Date(today); startDate.setDate(startDate.getDate()-29);
  const gridStart = new Date(startDate); gridStart.setDate(gridStart.getDate()-startDate.getDay());
  const dayNames = ['S','M','T','W','T','F','S'];
  let cells = '';
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(d.getDate()+i);
    if(d>today || d<startDate){ cells += '<div class="cal-cell cal-blank"></div>'; continue; }
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const isToday = iso===todayISO();
    const score = workoutDayScore(iso);
    if(score===null){
      cells += '<div class="cal-cell cal-none'+(isToday?' cal-today':'')+'" title="'+iso+' &middot; no workout">'+d.getDate()+'</div>';
    } else {
      const band = score>=75 ? 'cal-good' : (score>=50 ? 'cal-warn' : 'cal-bad');
      cells += '<button class="cal-cell '+band+(isToday?' cal-today':'')+'" data-action="view-day" data-date="'+iso+'" title="'+iso+' &middot; score '+score+'">'+d.getDate()+'</button>';
    }
  }
  return '<div class="cal-card">'
    + '<div class="gauge-label" style="margin-bottom:10px">Last 30 Days</div>'
    + '<div class="cal-weekdays">'+dayNames.map(function(n){ return '<span>'+n+'</span>'; }).join('')+'</div>'
    + '<div class="cal-grid">'+cells+'</div>'
    + '<div class="cal-legend">'
    +   '<span class="cal-legend-item"><i class="dot good"></i>75-100</span>'
    +   '<span class="cal-legend-item"><i class="dot warn"></i>50-74</span>'
    +   '<span class="cal-legend-item"><i class="dot bad"></i>Below 50</span>'
    +   '<span class="cal-legend-item"><i class="dot none"></i>No workout</span>'
    + '</div>'
    + '</div>';
}

function renderLastWorkoutWidget(){
  if(!workouts.length) return '';
  const last = workouts[0];
  const score = workoutDayScore(last.date);
  const scoreColor = score>=75 ? 'var(--good)' : (score>=50 ? 'var(--warn)' : 'var(--bad)');
  let topSet=null, topE1rm=0, isPR=false;
  (last.entries||[]).forEach(function(en){
    const allTimeBefore = bestE1rmEver(en.exerciseId, last.date);
    (en.sets||[]).forEach(function(s){
      const v = e1rm(effectiveWeight(en.exerciseId,s.weight), s.reps);
      if(v>topE1rm){ topE1rm=v; topSet={exerciseId:en.exerciseId, weight:s.weight, reps:s.reps}; isPR = v>=allTimeBefore-0.01; }
    });
  });
  const exNames = (last.entries||[]).map(function(en){ const ex=exById(en.exerciseId); return ex?ex.name:en.exerciseId; });
  const exSummary = exNames.slice(0,2).join(', ') + (exNames.length>2 ? ' +'+(exNames.length-2)+' more' : '') + (last.durationMin ? ' &middot; '+last.durationMin+' min' : '');
  return '<div class="last-wk-card" data-action="view-day" data-date="'+last.date+'">'
    + '<div class="last-wk-left"><div class="last-wk-label">Last Workout</div><div class="last-wk-date">'+fmtDate(last.date)+'</div><div class="last-wk-exercises">'+exSummary+'</div></div>'
    + '<div class="last-wk-stats">'
    +   '<div class="last-wk-stat"><div class="last-wk-score-pill" style="background:'+scoreColor+'">'+score+'</div><div class="last-wk-stat-key">Score</div></div>'
    +   '<div class="last-wk-stat"><div class="last-wk-stat-val">'+(topSet ? Math.round(topSet.weight)+'&times;'+topSet.reps : '&mdash;')+'</div><div class="last-wk-stat-key">'+(isPR && topSet ? 'New PR' : 'Top Set')+'</div></div>'
    + '</div></div>';
}

/* Plain-language explanations for each of the six 7-day score chips —
   surfaced via a tap-to-open info modal, since the one-word labels
   (Overload especially) don't explain themselves. */
const SCORE_CHIP_INFO = {
  freq: { label:'Frequency', text:'How many of your muscle groups got trained at least twice this week — research points to ~2x/week per muscle group as the sweet spot for growth, so this is about spreading training across the week, not just counting workouts.' },
  vol: { label:'Volume', text:'Working sets (strength) and/or minutes (cardio) this week compared against your own trailing 4-week average. Scores highest in a slight-overload zone — a bit above your usual, not a huge jump and not a plateau.' },
  intensity: { label:'Intensity', text:'For lifting: how close your sets averaged to your goal\'s target effort (Strain or %1RM). For cardio: whether you stayed in the moderate-to-vigorous zone (Strain 4-8) that ACSM guidelines call for, rather than all-out effort every session.' },
  overload: { label:'Overload', text:'Short for Progressive Overload — whether your estimated 1-rep-maxes have actually trended up over the last 5 weeks. This is the single most research-backed driver of strength and muscle gains: no gradual increase in demand, no adaptation. Scaled to your relative strength level so beginners and advanced lifters are held to different, realistic rates of gain.' },
  consistency: { label:'Consistency', text:'How many of the last 4 weeks had at least one workout logged. Adherence over time is one of the strongest real-world predictors of results — the best program is the one you actually stick with.' },
  recovery: { label:'Recovery', text:'Dings training with zero rest days across an entire week. Under-recovery is a real risk to progress and injury risk, not just "more is always better."' }
};
function scoreChip(value, key){
  const info = SCORE_CHIP_INFO[key];
  return '<div class="chip"><div class="chip-val">'+value+'</div>'
    + '<div class="chip-key">'+info.label+' <button class="chip-info-btn" data-action="show-chip-info" data-key="'+key+'" aria-label="What is '+info.label+'?">i</button></div></div>';
}
function chipInfoModal(){
  const info = SCORE_CHIP_INFO[state.chipInfoKey];
  if(!info) return '';
  return '<div class="modal-backdrop" data-action="close-chip-info">'

    + '<h3 style="margin:0 0 8px;font-size:17px">'+info.label+'</h3>'

    + '<button class="btn btn-primary" data-action="close-chip-info">Got it</button>'
    + '</div></div>';
}
