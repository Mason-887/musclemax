/* Continuous green -> yellow -> orange -> red heat gradient (like a
   real muscle-recovery heatmap) instead of a 3-bucket palette — every
   point score gets its own shade rather than snapping between a
   handful of fixed colors. Only used for this diagram; the rest of
   the app keeps strainColor()'s bucketed palette. */
function diagramHeatColor(score){
  if(score===null) return '#2f3444';
  const hue = 128 - clamp(score,0,100)*1.28;
  const light = 46 + (score/100)*6;
  return 'hsl('+hue.toFixed(0)+', 80%, '+light.toFixed(0)+'%)';
}
function bodyDiagramSvg(){
  const g = {};
  GROUP_ORDER.forEach(function(grp){ g[grp] = groupStrain(grp,7); });
  function t(grp){ const s=g[grp]; return grp+': '+(s===null?'not trained this week':s+'/100 strain'); }
  function glow(grp){ return (g[grp]!==null && g[grp]>=67) ? ' filter="url(#bodyGlow)"' : ''; }
  const defs = '<defs><filter id="bodyGlow" x="-60%" y="-60%" width="220%" height="220%">'
    + '<feGaussianBlur stdDeviation="0.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>'
    + '</filter></defs>';
  function figure(list, viewBox){
    let s = defs;
    list.forEach(function(e){
      const grp = e[0], d = e[1];
      if(!grp){
        s += '<path d="'+d+'" fill="#2f3444" stroke="#1b1e27" stroke-width="0.12"/>';
        return;
      }
      s += '<path d="'+d+'" fill="'+diagramHeatColor(g[grp])+'" stroke="#1b1e27" stroke-width="0.12"'+glow(grp)+'><title>'+t(grp)+'</title></path>';
    });
    return '<svg class="body-svg" viewBox="'+viewBox+'" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';
  }
  return '<div class="body-diagram">'
    + '<div class="body-col"><div class="body-caption">Front</div>'+figure(BODY_FRONT,'0 0 35 93')+'</div>'
    + '<div class="body-col"><div class="body-caption">Back</div>'+figure(BODY_BACK,'37 0 35 93')+'</div>'
    + '</div>';
}
function renderVolumeBars(){
  const vols = {};
  GROUP_ORDER.forEach(function(g){ vols[g] = groupWeeklyVolume(g,0); });
  const max = Math.max.apply(null, GROUP_ORDER.map(function(g){ return vols[g]; })) || 1;
  const rows = GROUP_ORDER.map(function(g){
    const pct = Math.round((vols[g]/max)*100);
    return '<div class="vol-bar-row"><span class="vol-bar-label">'+g+'</span><div class="vol-bar-track"><div class="vol-bar-fill" style="width:'+pct+'%; background:'+strainColor(groupStrain(g,7))+'"></div></div><span class="vol-bar-val">'+Math.round(vols[g])+' sets</span></div>';
  }).join('');
  return '<div class="trend-card"><div class="gauge-label" style="margin-bottom:10px">Volume by Muscle Group (7d)</div>'+rows+'</div>';
}
function renderGroupCard(group){
  const strain = groupStrain(group,7);
  const thisWk = groupWeeklyVolume(group,0);
  const lastWk = groupWeeklyVolume(group,1);
  const delta = lastWk>0 ? Math.round(((thisWk-lastWk)/lastWk)*100) : null;
  const sessions = workouts.filter(function(w){ return daysAgo(w.date)<=7 && groupsHit(w).has(group); }).length;
  const lastDate = groupLastTrainedDate(group);
  const strainLabel = strain===null ? 'Not trained' : strain+'/100';
  const deltaLabel = delta===null ? '' : (delta>=0?' +':' ')+delta+'%';
  return '<div class="group-card">'
    + '<div class="group-card-head"><span class="group-dot" style="background:'+strainColor(strain)+'"></span><h3>'+group+'</h3><span class="group-strain">'+strainLabel+'</span></div>'
    + '<div class="group-stats-row">'
    +   '<div><div class="group-stat-val">'+Math.round(thisWk)+'<span style="font-size:10px;font-weight:500;"> sets</span></div><div class="group-stat-key">Volume (7d)'+deltaLabel+'</div></div>'
    +   '<div><div class="group-stat-val">'+sessions+'</div><div class="group-stat-key">Sessions (7d)</div></div>'
    +   '<div><div class="group-stat-val">'+(lastDate?fmtDate(lastDate):'Never')+'</div><div class="group-stat-key">Last Trained</div></div>'
    + '</div></div>';
}
function scoreTrendSvg(){
  const points = workouts.filter(function(w){ return daysAgo(w.date)<=30; })
    .map(function(w){ return { date:w.date, score:workoutDayScore(w.date) }; });
  points.sort(function(a,b){ return a.date<b.date?-1:1; });
  if(points.length<2){
    return '<div class="trend-card"><div class="gauge-label" style="margin-bottom:6px">Score Trend &middot; Last 30 Days</div><div class="empty-state" style="padding:16px 0;">Log a few more workouts to see a trend.</div></div>';
  }
  const W=560,H=150,PAD=30;
  const stepX = (W-PAD*2)/(points.length-1);
  const pts = points.map(function(p,i){
    const x = PAD+i*stepX;
    const y = H-PAD - (p.score/100)*(H-PAD*2);
    return [x,y];
  });
  const d = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  const dots = pts.map(function(p,i){
    const s = points[i].score;
    const color = s>=75?'var(--good)':(s>=50?'var(--warn)':'var(--bad)');
    return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.6" fill="'+color+'"><title>'+fmtDate(points[i].date)+': '+s+'/100</title></circle>';
  }).join('');
  const grid = [25,50,75].map(function(v){
    const y = (H-PAD-(v/100)*(H-PAD*2)).toFixed(1);
    return '<line x1="'+PAD+'" y1="'+y+'" x2="'+(W-PAD)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>';
  }).join('');
  return '<div class="trend-card"><div class="gauge-label" style="margin-bottom:10px">Score Trend &middot; Last 30 Days</div>'
    + '<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    + grid
    + '<line x1="'+PAD+'" y1="'+(H-PAD)+'" x2="'+(W-PAD)+'" y2="'+(H-PAD)+'" stroke="var(--border)" stroke-width="1"/>'
    + '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'
    + dots
    + '</svg></div>';
}
/* Per-activity cardio totals for the window, ranked by time invested —
   the metric that stays comparable across activities where distance
   doesn't (a rower and a walk both take minutes; only one covers miles). */
function cardioActivityStats(days){
  const cutoff = days || 7;
  const stats = {};
  workouts.forEach(function(w){
    if(daysAgo(w.date) > cutoff) return;
    (w.entries||[]).forEach(function(en){
      const ex = exById(en.exerciseId);
      if(!ex || !ex.cardio) return;
      if(!stats[ex.id]) stats[ex.id] = { ex:ex, minutes:0, distance:0, sessions:0 };
      let any = false;
      (en.sets||[]).forEach(function(s){
        stats[ex.id].minutes += (s.minutes||0);
        stats[ex.id].distance += (s.distance||0);
        any = true;
      });
      if(any) stats[ex.id].sessions++;
    });
  });
  const list = Object.keys(stats).map(function(id){ return stats[id]; });
  list.sort(function(a,b){ return b.minutes-a.minutes; });
  return list;
}
function renderCardioRanking(){
  const days = 7;
  const list = cardioActivityStats(days);
  if(!list.length) return '';
  const totalMin = list.reduce(function(s,i){ return s+i.minutes; }, 0);
  const totalDist = list.reduce(function(s,i){ return s+i.distance; }, 0);
  const totalSessions = list.reduce(function(s,i){ return s+i.sessions; }, 0);
  const rows = list.map(function(item, i){
    const pace = item.distance>0.05 ? (item.minutes/item.distance) : null;
    return '<div class="cardio-rank-row">'
      + '<span class="cardio-rank-num">'+(i+1)+'</span>'
      + '<div class="cardio-rank-name"><div class="cardio-rank-title">'+item.ex.name+'</div><div class="cardio-rank-sub">'+item.sessions+' session'+(item.sessions===1?'':'s')+(pace?' &middot; '+pace.toFixed(1)+' min/mi':'')+'</div></div>'
      + '<div class="cardio-rank-stats"><div class="cardio-rank-val">'+Math.round(item.minutes)+'<span> min</span></div>'+(item.distance>0?'<div class="cardio-rank-val2">'+item.distance.toFixed(1)+' mi</div>':'')+'</div>'
      + '</div>';
  }).join('');
  return '<div class="trend-card">'
    + '<div class="gauge-label" style="margin-bottom:4px">Cardio Ranking &middot; Last '+days+' Days</div>'
    + '<div class="cardio-total-sub">'+totalSessions+' session'+(totalSessions===1?'':'s')+' &middot; '+Math.round(totalMin)+' min &middot; '+totalDist.toFixed(1)+' mi total</div>'
    + '<div class="cardio-rank-list">'+rows+'</div>'
    + '</div>';
}
function renderTracking(){
  let html = '<div class="topbar"><h1 style="font-size:19px; font-weight:800;">Tracking</h1></div>';
  html += '<div class="body-diagram-card">'
    + '<div class="body-diagram-label">Muscle Strain &middot; Last 7 Days</div>'
    + bodyDiagramSvg()
    + '<div class="body-legend-dark">'
    +   '<span class="cal-legend-item"><i class="dot" style="background:#3a4152"></i>None</span>'
    +   '<span class="cal-legend-item"><i class="dot" style="background:hsl(120,75%,50%)"></i>Light</span>'
    +   '<span class="cal-legend-item"><i class="dot" style="background:hsl(60,85%,50%)"></i>Moderate</span>'
    +   '<span class="cal-legend-item"><i class="dot" style="background:hsl(6,85%,55%)"></i>High</span>'
    + '</div></div>';
  html += scoreTrendSvg();
  html += renderCardioRanking();
  html += renderVolumeBars();
  html += '<div class="group-card-list">' + GROUP_ORDER.map(renderGroupCard).join('') + '</div>';
  return html;
}

    const open = state.historyOpenId===w.id;
    const score = workoutDayScore(w.date);
    const scoreColor = score>=75 ? 'var(--good)' : (score>=50 ? 'var(--warn)' : 'var(--bad)');
    html += '<div class="wk-card" data-action="toggle-history" data-id="'+w.id+'">'
      + '<div class="wk-top"><div><div class="wk-date">'+fmtDate(w.date)+'</div><div class="wk-sub">'+Array.from(gs).join(' · ')+'</div></div>'
      + '<span class="score-pill" style="background:'+scoreColor+'; color:#fff;">'+score+'</span></div>'
      + '<div class="wk-meta"><span>Volume <b>'+vol+' set'+(vol===1?'':'s')+'</b></span><span>Exercises <b>'+(w.entries||[]).length+'</b></span>'
      + (w.durationMin?'<span>Duration <b>'+w.durationMin+' min</b></span>':'')
      + (w.avgRestSec?'<span>Avg Rest <b>'+w.avgRestSec+'s</b></span>':'')
      + '</div>';
    if(open){
      html += '<div class="wk-detail">';
      (w.entries||[]).forEach(function(en){
        const ex = exById(en.exerciseId);
        const sets = en.sets||[];
        let setsLabel;
        if(ex && ex.cardio){
          setsLabel = sets.map(function(s){ return s.minutes+' min'+(s.distance?' &middot; '+s.distance+' mi':''); }).join(', ');
        } else {
          const reps = sets.map(function(s){ return s.reps; });
          const uniform = reps.length && reps.every(function(r){ return r===reps[0]; });
          setsLabel = uniform ? (sets.length+'×'+reps[0]) : (sets.length+' sets ('+reps.join(', ')+')');
        }
        html += '<div class="wk-ex-row"><span>'+(ex?ex.name:en.exerciseId)+'</span><span class="sets">'+setsLabel+'</span></div>';
      });
      const rec = workoutRecommendation(w.date);
      if(rec && !rec.green && rec.tips.length){
        html += '<div class="rec-hint"><b>To make this a green workout:</b><ul class="rec-list">'
          + rec.tips.map(function(tip){ return '<li>'+tip+'</li>'; }).join('')
          + '</ul></div>';
      } else if(rec && rec.green){
        html += '<div class="rec-hint good"><b>Already a green workout</b> — solid volume and effort for where you\'re at.</div>';
      }
      if(!state.viewingFriend){
        html += '<div class="wk-actions">'
          + '<button class="btn-ghost btn" data-action="edit-workout" data-id="'+w.id+'">Edit</button>'
          + '<button class="btn-ghost btn danger" data-action="delete-workout-direct" data-id="'+w.id+'">Delete</button>'
          + '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

/* ---------------- render: new workout ---------------- */
function ensureDraft(){
  if(!state.draft) state.draft = { date: todayISO(), entries: [] };
}
/* Muscle slang that doesn't appear in any exercise or group name as
   written — without this, "bicep", "delts", "quads" etc. return
   nothing even though they're exactly what someone would type. */
const SEARCH_SYNONYMS = {
  bicep:'curl', biceps:'curl',
  tricep:'triceps', triceps:'triceps',
  delt:'shoulder', delts:'shoulder', deltoid:'shoulder', deltoids:'shoulder',
  quad:'squat', quads:'squat',
  hamstring:'curl', hamstrings:'curl',
  glute:'hip thrust', glutes:'hip thrust',
  ab:'core', abs:'core',
  lat:'pulldown row', lats:'pulldown row',
  pec:'chest', pecs:'chest',
  calf:'calf', calves:'calf'
};
/* Lowercases, turns hyphens into spaces (so "pull up" matches
   "Pull-Up"), and strips anything else that isn't a letter/number. */
function normalizeSearch(s){
  return (s||'').toLowerCase().replace(/-/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function exerciseHaystack(e){
  return normalizeSearch(e.name+' '+e.group+(e.cardio?' cardio':''));
}
function filteredExercises(){
  const raw = normalizeSearch(state.pickerQuery);
  if(!raw) return allExercises();
  const words = raw.split(' ').filter(Boolean).map(function(w){ return SEARCH_SYNONYMS[w] || w; });
  return allExercises().filter(function(e){
    const hay = exerciseHaystack(e);
    return words.every(function(w){ return hay.indexOf(w)>-1; });
  });
}
/* Built once per keystroke and swapped into #picker-results only — the
   search <input> itself is never touched/rebuilt, so focus, cursor
   position and the on-screen keyboard all survive typing. Rebuilding
   the whole picker (input included) on every keystroke was the cause
   of "search doesn't always work": each render tore down and recreated
   the input element, which is exactly what makes mobile keyboards
   flicker/dismiss and can drop fast keystrokes. */
function pickerRowsHtml(){
  const cardioOnly = !!(state.draft && state.draft.cardioOnly);
  const list = filteredExercises().filter(function(e){ return cardioOnly ? e.cardio : true; });
  let html = '';
  const groups = cardioOnly ? ['Cardio'] : GROUP_ORDER.concat(['Cardio','Custom']);
  let any = false;
  groups.forEach(function(g){
    const items = list.filter(function(e){ return (g==='Custom' ? e.group==='Custom' || customExercises.some(function(c){return c.id===e.id;}) : e.group===g); });
    if(!items.length) return;
    any = true;
    if(!cardioOnly) html += '<div class="picker-group-label">'+g+'</div>';
    items.forEach(function(e){
      const last = lastPerformedSummary(e.id);
      html += '<div class="picker-row" data-action="pick-exercise" data-id="'+e.id+'"><span class="pname">'+e.name+'</span><span class="plast">'+(last||'new')+'</span></div>';
    });
  });
  if(!any) html += '<div class="empty-state" style="padding:24px 16px;">No matches.</div>';
  if(!cardioOnly) html += '<div class="add-custom-link" data-action="open-custom">+ Add custom exercise</div>';
  return html;
}

  const cardioOnly = !!(state.draft && state.draft.cardioOnly);

    + '<input id="picker-search" placeholder="'+(cardioOnly?'Search cardio…':'Search exercises…')+'" value="'+state.pickerQuery.replace(/"/g,'&quot;')+'"/></div>';

/* ---------------- render: exercise detail ---------------- */
function trendSvg(hist){
  if(hist.length<2) return '';
  const W=560,H=140,PAD=28;
  const vals = hist.map(function(h){return h.e1rm;});
  const max = Math.max.apply(null,vals), min = Math.min.apply(null,vals);
  const range = (max-min)||1;
  const stepX = (W-PAD*2)/(hist.length-1);
  const pts = hist.map(function(h,i){
    const x = PAD+i*stepX;
    const y = H-PAD - ((h.e1rm-min)/range)*(H-PAD*2);
    return [x,y];
  });
  const d = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  const dots = pts.map(function(p){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="var(--accent)"/>'; }).join('');
  return '<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    + '<line x1="'+PAD+'" y1="'+(H-PAD)+'" x2="'+(W-PAD)+'" y2="'+(H-PAD)+'" stroke="var(--border)" stroke-width="1"/>'
    + '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'
    + dots + '</svg>';
}

  const ex = exById(state.detailExId);

  let html = '<div class="topbar"><button class="back-btn" data-action="go-history">&larr; Back</button><div class="brand"><h1 style="font-size:18px">'+ex.name+'</h1></div><span style="width:70px"></span></div>';
  html += '<div class="trend-card"><div class="detail-e1rm">Estimated 1-rep max trend ('+hist.length+' session'+(hist.length===1?'':'s')+')</div>'+trendSvg(hist)+'</div>';
  if(perf){
    html += '<div class="chip-row" style="grid-template-columns:1fr 1fr">'
      + '<div class="chip"><div class="chip-val">'+(perf.score===null?'—':perf.score)+'</div><div class="chip-key">Performance Score</div></div>'
      + '<div class="chip"><div class="chip-val">'+perf.sessions+'</div><div class="chip-key">Sessions Logged</div></div>'
      + '</div>';

  return html;
}

/* ---------------- master render ---------------- */
const TAB_VIEWS = ['home','tracking','prs','feed','friends','history'];
let _lastRenderedView = null;
function render(){
  const app = document.getElementById('app');
  const prevShell = document.querySelector('.shell');
  const preserveScroll = prevShell && _lastRenderedView===state.view;
  const scrollTop = preserveScroll ? prevShell.scrollTop : 0;
  let html = '';
  if(!state.me){ html = renderOnboarding(); }
  else if(state.view==='home') html = renderHome();
  else if(state.view==='tracking') html = renderTracking();
  else if(state.view==='prs') html = renderPRs();
  else if(state.view==='history') html = renderHistory();
  else if(state.view==='workout') html = renderWorkout();
  else if(state.view==='detail') html = renderDetail();
  else if(state.view==='friends') html = renderFriends();
  else if(state.view==='feed') html = renderFeed();
  const showTabs = state.me && TAB_VIEWS.indexOf(state.view)>-1;
  app.innerHTML = '<div class="shell">'+html+'</div>' + (showTabs ? renderTabBar() : '') + (state.editingStats ? statsModal() : '') + (state.chipInfoKey ? chipInfoModal() : '');
  const newShell = document.querySelector('.shell');
  if(newShell) newShell.scrollTop = scrollTop;
  _lastRenderedView = state.view;
  bindInputs();
}

function bindInputs(){
  const search = document.getElementById('picker-search');
  if(search){
    search.addEventListener('input', function(e){
      state.pickerQuery = e.target.value;
      const results = document.getElementById('picker-results');
      if(results) results.innerHTML = pickerRowsHtml();
    });
  }
}
function focusSearchEnd(){
  const search = document.getElementById('picker-search');
  if(search){ search.focus(); const v=search.value; search.value=''; search.value=v; }
}

/* ---------------- event delegation ---------------- */
document.getElementById('app').addEventListener('click', async function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');
  if(action==='save-name'){
    const val = document.getElementById('onboard-name').value.trim();
    if(!val) return;
    state.me = val;
    localStorage.setItem('ironledger_me', val);
    refreshScope();
    render();
    ensureMyProfileCode();
  }
  else if(action==='edit-name'){
    state.editingStats = true;
    render();
  }
  else if(action==='close-stats'){
    if(e.target===t){ state.editingStats = false; render(); }
  }
  else if(action==='show-chip-info'){
    state.chipInfoKey = t.getAttribute('data-key');
    render();
  }
  else if(action==='close-chip-info'){
    if(e.target===t){ state.chipInfoKey = null; render(); }
  }
  else if(action==='save-stats'){
    const nameVal = document.getElementById('cs-name').value.trim();
    if(nameVal && nameVal!==state.me){
      state.me = nameVal;
      localStorage.setItem('ironledger_me', nameVal);
      refreshScope();
      ensureMyProfileCode();
      subscribeMyStats();
    }
    const heightIn = +document.getElementById('cs-height').value || null;
    const weightLb = +document.getElementById('cs-weight').value || null;
    const bodyFatPct = +document.getElementById('cs-bf').value || null;
    const sex = document.getElementById('cs-sex').value || null;
    const goal = document.getElementById('cs-goal').value || null;
    state.editingStats = false;
    render();
    saveMyStats({ heightIn:heightIn, weightLb:weightLb, bodyFatPct:bodyFatPct, sex:sex, goal:goal });
  }
  else if(action==='add-friend-by-name'){
    const input = document.getElementById('friend-username');
    const typed = input ? input.value.trim() : '';
    state.friendMsgOk = false;
    if(!typed){ state.friendMsg = 'Enter a username first.'; render(); return; }
    if(norm(typed)===norm(state.me)){ state.friendMsg = "That's you."; render(); return; }
    const match = profileByName(typed);
    if(!match){ state.friendMsg = 'No one found with the username "'+typed+'".'; render(); return; }
    const existing = friendshipWith(match);
    if(existing){
      state.friendMsg = existing.status==='accepted'
        ? 'You and '+match+' are already friends.'
        : 'There\'s already a pending request with '+match+'.';
      render(); return;
    }
    state.friendMsg = 'Request sent to '+match+'.';
    state.friendMsgOk = true;
    render();
    sendFriendRequest(match);
  }
  else if(action==='send-request'){
    state.friendMsg = null;
    sendFriendRequest(t.getAttribute('data-name'));
  }
  else if(action==='accept-request'){ state.friendMsg = null; respondToRequest(t.getAttribute('data-id'), true); }
  else if(action==='decline-request'){ state.friendMsg = null; respondToRequest(t.getAttribute('data-id'), false); }
  else if(action==='remove-friend'){ state.friendMsg = null; removeFriendship(t.getAttribute('data-id')); }
  else if(action==='view-friend'){
    state.viewingFriend = t.getAttribute('data-name');
    refreshScope();
    state.historyOpenId = null;
    state.view = 'home';
    render();
  }
  else if(action==='stop-viewing-friend'){
    state.viewingFriend = null;
    refreshScope();
    render();
  }
  else if(action==='pause-workout'){
    savePausedDraft(state.draft);
    state.draft = null;
    state.pickerOpen = false;
    state.view = 'home';
    render();
  }
  else if(action==='resume-paused'){
    const paused = getPausedDraft();
    if(!paused) return;
    state.draft = paused;
    clearPausedDraft();
    state.pickerOpen = false;
    state.editingWorkoutId = null;
    state.view = 'workout';
    render();
  }
  else if(action==='discard-paused'){
    if(!confirm('Discard this paused workout?')) return;
    clearPausedDraft();
    render();
  }
  else if(action==='new-workout'){ state.draft={date:todayISO(), entries:[], cardioOnly:false, startedAt:Date.now()}; state.pickerOpen=true; state.pickerQuery=''; state.view='workout'; render(); }
  else if(action==='new-cardio'){ state.draft={date:todayISO(), entries:[], cardioOnly:true, startedAt:Date.now()}; state.pickerOpen=true; state.pickerQuery=''; state.view='workout'; render(); }
  else if(action==='view-history'){ state.historyOpenId=null; state.view='history'; render(); }
  else if(action==='go-tab'){
    if(state.viewingFriend){ state.viewingFriend=null; refreshScope(); }
    state.view = t.getAttribute('data-view');
    state.historyOpenId = null;
    state.friendMsg = null;
    render();
  }
  else if(action==='react'){
    toggleReaction(t.getAttribute('data-id'), t.getAttribute('data-emoji'));
  }
  else if(action==='go-home'){ state.view='home'; render(); }
  else if(action==='go-history'){ state.view='history'; render(); }
  else if(action==='toggle-history'){ const id=t.getAttribute('data-id'); state.historyOpenId = state.historyOpenId===id? null : id; render(); }
  else if(action==='cancel-workout'){
    if(!state.draft.entries.length || confirm(state.editingWorkoutId?'Discard these changes?':'Discard this workout?')){
      const backTo = state.editingWorkoutId ? 'history' : 'home';
      state.draft=null; state.editingWorkoutId=null; state.view=backTo; render();
    }
  }
  else if(action==='edit-workout'){
    const id = t.getAttribute('data-id');
    const w = workouts.find(function(x){ return x.id===id; });
    if(!w) return;
    state.draft = { date: w.date, entries: JSON.parse(JSON.stringify(w.entries||[])), durationMin: w.durationMin||null, avgRestSec: w.avgRestSec||null };
    state.editingWorkoutId = id;
    state.pickerOpen = false;
    state.view = 'workout';
    render();
  }
  else if(action==='delete-workout'){
    if(!confirm('Delete this workout? This can\'t be undone.')) return;
    const id = state.editingWorkoutId;
    state.draft = null; state.editingWorkoutId = null; state.view = 'history';
    deleteWorkout(id);
    render();
  }
  else if(action==='delete-workout-direct'){
    const id = t.getAttribute('data-id');
    if(!confirm('Delete this workout? This can\'t be undone.')) return;
    deleteWorkout(id);
  }
  else if(action==='open-picker'){ state.pickerOpen=true; state.pickerQuery=''; render(); focusSearchEnd(); }
  else if(action==='pick-exercise'){
    const id = t.getAttribute('data-id');
    const ex = exById(id);
    let seed;
    if(ex.cardio){
      seed = {minutes:null, distance:null, rpe:null};
    } else {
      const rec = recommendation(id);
      seed = rec ? {weight:rec.weight, reps:rec.reps, rpe:null} : {weight:null, reps:ex.repLow, rpe:null};
    }
    seed.loggedAt = Date.now();
    state.draft.entries.push({ exerciseId:id, sets:[Object.assign({}, seed)] });
    state.pickerOpen=false; state.pickerQuery='';
    render();
  }
  else if(action==='remove-exercise'){ const idx=+t.getAttribute('data-idx'); state.draft.entries.splice(idx,1); render(); }
  else if(action==='add-set'){
    const idx=+t.getAttribute('data-idx');
    const ex = exById(state.draft.entries[idx].exerciseId);
    const sets = state.draft.entries[idx].sets;
    const last = sets[sets.length-1];
    if(ex && ex.cardio){
      sets.push({ minutes:last?last.minutes:null, distance:last?last.distance:null, rpe:null, loggedAt:Date.now() });
    } else {
      sets.push({ weight:last?last.weight:null, reps:last?last.reps:null, rpe:null, loggedAt:Date.now() });
    }
    render();
  }
  else if(action==='remove-set'){ const idx=+t.getAttribute('data-idx'), si=+t.getAttribute('data-si'); state.draft.entries[idx].sets.splice(si,1); render(); }
  else if(action==='open-custom'){ state.addingCustom=true; render(); }
  else if(action==='close-custom'){ if(e.target===t){ state.addingCustom=false; render(); } }
  else if(action==='save-custom'){
    const name = document.getElementById('ce-name').value.trim();
    if(!name) return;
    const group = document.getElementById('ce-group').value;
    const type = document.getElementById('ce-type').value;
    const low = +document.getElementById('ce-low').value||8;
    const high = +document.getElementById('ce-high').value||12;
    const ex = { name:name, group:group, type:type, repLow:low, repHigh:high };
    addCustomExercise(ex);
    state.addingCustom=false;
    render();
  }
  else if(action==='finish-workout'){
    const entries = state.draft.entries.map(function(en){
      const ex = exById(en.exerciseId);
      const sets = ex && ex.cardio
        ? en.sets.filter(function(s){ return s.minutes; }).map(function(s){ return {minutes:+s.minutes, distance:s.distance?+s.distance:null, rpe: s.rpe?+s.rpe:null}; })
        : en.sets.filter(function(s){ return isStrengthSetValid(en.exerciseId,s); }).map(function(s){ return {weight:+s.weight||0, reps:+s.reps, rpe: s.rpe?+s.rpe:null}; });
      return { exerciseId: en.exerciseId, sets: sets };
    }).filter(function(en){ return en.sets.length; });
    if(!entries.length) return;
    if(!confirm(state.editingWorkoutId ? 'Save these changes?' : 'Finish this workout?')) return;
    if(state.editingWorkoutId){
      updateWorkout(state.editingWorkoutId, { date: state.draft.date, entries: entries, durationMin: state.draft.durationMin||null, avgRestSec: state.draft.avgRestSec||null });
      state.draft = null;
      state.editingWorkoutId = null;
      state.view = 'history';
    } else {
      const timing = computeTiming(state.draft);
      saveWorkout({ date: state.draft.date, entries: entries, durationMin: timing.durationMin, avgRestSec: timing.avgRestSec });
      state.draft = null;
      state.view = 'home';
    }
    render();
  }
  else if(action==='view-day'){
    const date = t.getAttribute('data-date');
    const w = workouts.find(function(w){ return w.date===date; });
    if(w){ state.historyOpenId = w.id; state.view = 'history'; render(); }
  }
  else if(action==='view-exercise'){ state.detailExId = t.getAttribute('data-id'); state.view='detail'; render(); }
});

document.getElementById('app').addEventListener('change', function(e){
  const t = e.target.closest('[data-action="set-field"]');
  if(!t) return;
  const idx=+t.getAttribute('data-idx'), si=+t.getAttribute('data-si'), field=t.getAttribute('data-field');
  const val = t.value===''? null : +t.value;
  state.draft.entries[idx].sets[si][field] = val;
  render();
});
document.getElementById('app').addEventListener('input', function(e){
  const t = e.target.closest('input[data-action="set-field"]');
  if(!t) return;
  const idx=+t.getAttribute('data-idx'), si=+t.getAttribute('data-si'), field=t.getAttribute('data-field');
  const val = t.value===''? null : +t.value;
  state.draft.entries[idx].sets[si][field] = val;
});

initStorage();
})();
</script>
